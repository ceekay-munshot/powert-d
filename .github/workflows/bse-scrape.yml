name: BSE scrape and documents

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1,14 * * *'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Scrape all registered companies
        run: node scripts/scrape-all.mjs

      - name: Fetch and extract documents
        run: node scripts/fetch-documents.mjs

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: refresh BSE scrape + documents ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
